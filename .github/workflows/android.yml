name: Android CI & Public Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'db4ff5546d1b35981cc4715cdd5f27f7' }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID || 'eb808b74d884b9578db1039a07314e471940e10045ba86e07dc6aad79649b49e' }}
        MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID || '939d2b9ffa1aa647222b8ed1f8a9be92' }}
        MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET || '72dd8b422fe2c6811757817fb7df981227696ab0262b937210c652b6a51c9f39' }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '547903414124-6sl6utfrls85ajguhhf2v6kqgg00hq09.apps.googleusercontent.com' }}
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Multi-Architecture APKs
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'db4ff5546d1b35981cc4715cdd5f27f7' }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID || 'eb808b74d884b9578db1039a07314e471940e10045ba86e07dc6aad79649b49e' }}
        MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID || '939d2b9ffa1aa647222b8ed1f8a9be92' }}
        MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET || '72dd8b422fe2c6811757817fb7df981227696ab0262b937210c652b6a51c9f39' }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '547903414124-6sl6utfrls85ajguhhf2v6kqgg00hq09.apps.googleusercontent.com' }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Package Release Assets & Compute Checksums
      run: |
        OUT_DIR="app/build/outputs/apk/debug"
        RELEASE_DIR="release_artifacts"
        mkdir -p "$RELEASE_DIR"

        # Copy the multi-architecture & universal APKs
        if compgen -G "$OUT_DIR/Animarvle-Android-*.apk" > /dev/null; then
          cp "$OUT_DIR"/Animarvle-Android-*.apk "$RELEASE_DIR/"
        else
          cp "$OUT_DIR/app-arm64-v8a-debug.apk" "$RELEASE_DIR/Animarvle-Android-arm64-v8a.apk" 2>/dev/null || true
          cp "$OUT_DIR/app-armeabi-v7a-debug.apk" "$RELEASE_DIR/Animarvle-Android-armeabi-v7a.apk" 2>/dev/null || true
          cp "$OUT_DIR/app-x86_64-debug.apk" "$RELEASE_DIR/Animarvle-Android-x86_64.apk" 2>/dev/null || true
          cp "$OUT_DIR/app-universal-debug.apk" "$RELEASE_DIR/Animarvle-Android-universal.apk" 2>/dev/null || true
          cp "$OUT_DIR/app-debug.apk" "$RELEASE_DIR/Animarvle-Android-universal.apk" 2>/dev/null || true
        fi

        # Generate sha256 checksum files for each APK
        cd "$RELEASE_DIR"
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            sha256sum "$apk" > "${apk}.sha256"
            echo "Checksum for $apk: $(cat "${apk}.sha256")"
          fi
        done
        cd ..

        # On release tags, auto-commit the computed multi-arch sha256 to version.json in Core repo
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          UNI_HASH=$(awk '{print $1}' "$RELEASE_DIR/Animarvle-Android-universal.apk.sha256" 2>/dev/null || echo "")
          ARM64_HASH=$(awk '{print $1}' "$RELEASE_DIR/Animarvle-Android-arm64-v8a.apk.sha256" 2>/dev/null || echo "")
          ARM7_HASH=$(awk '{print $1}' "$RELEASE_DIR/Animarvle-Android-armeabi-v7a.apk.sha256" 2>/dev/null || echo "")
          X86_HASH=$(awk '{print $1}' "$RELEASE_DIR/Animarvle-Android-x86_64.apk.sha256" 2>/dev/null || echo "")

          git fetch origin main || true
          git checkout main || true
          python3 -c "import json; tag = '${{ github.ref_name }}'; base = f'https://github.com/nd7hdyt/AniMarvle/releases/download/{tag}'; d = json.load(open('version.json', encoding='utf-8')); d['sha256'] = '$UNI_HASH'; d['apk_url'] = f'{base}/Animarvle-Android-universal.apk'; d['architectures'] = {'arm64-v8a': {'apk_url': f'{base}/Animarvle-Android-arm64-v8a.apk', 'sha256': '$ARM64_HASH'}, 'armeabi-v7a': {'apk_url': f'{base}/Animarvle-Android-armeabi-v7a.apk', 'sha256': '$ARM7_HASH'}, 'x86_64': {'apk_url': f'{base}/Animarvle-Android-x86_64.apk', 'sha256': '$X86_HASH'}, 'universal': {'apk_url': f'{base}/Animarvle-Android-universal.apk', 'sha256': '$UNI_HASH'}}; open('version.json', 'w', encoding='utf-8').write(json.dumps(d, indent=2, ensure_ascii=False) + '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff-index --quiet HEAD || git commit -m "chore(release): auto-sync multi-arch version.json for ${{ github.ref_name }} [skip ci]"
          git push origin main || true
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Animarvle-Android-APKs
        path: |
          release_artifacts/*.apk
          release_artifacts/*.sha256
        if-no-files-found: warn

    - name: Publish GitHub Release to Public Repo
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        repository: nd7hdyt/AniMarvle
        token: ${{ secrets.PUBLIC_RELEASE_PAT }}
        tag_name: ${{ github.ref_name }}
        files: |
          release_artifacts/*.apk
          release_artifacts/*.sha256
        generate_release_notes: true

    - name: Sync README, version.json & Assets to Public Repo
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        PUBLIC_REPO: nd7hdyt/AniMarvle
        GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
      run: |
        git clone "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" public_repo
        
        # Copy README, version.json, and icon/assets
        cp README.md public_repo/
        cp version.json public_repo/
        mkdir -p public_repo/assets
        cp -r assets/* public_repo/assets/ 2>/dev/null || true
        
        cd public_repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git branch -M main
        git add README.md version.json assets
        git diff-index --quiet HEAD || git commit -m "chore(release): update README, version.json, and assets for ${{ github.ref_name }} [skip ci]"
        git push -u origin main
