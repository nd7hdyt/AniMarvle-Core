name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Compute Checksum & Auto-Sync version.json
      run: |
        APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
        HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
        echo "$HASH  app-debug.apk" > app/build/outputs/apk/debug/app-debug.apk.sha256
        echo "Computed SHA-256 Checksum: $HASH"

        # On release tags, auto-commit the computed sha256 to version.json on main
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          git fetch origin main
          git checkout main
          python3 -c "import json; d = json.load(open('version.json')); d['sha256'] = '$HASH'; open('version.json', 'w').write(json.dumps(d, indent=2) + '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff-index --quiet HEAD || git commit -m "chore(release): auto-sync version.json sha256 to $HASH [skip ci]"
          git push origin main
        fi

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk.sha256
        generate_release_notes: true


