# The vendored Aniyomi source-api (~50 Kotlin files) plus the app modules need more
# metaspace than the 512 MiB default, otherwise the daemon dies mid-compile.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official